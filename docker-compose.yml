# -----------------------------------------------------------------------
# docker-compose.yml สำหรับ Keyboard Cemetery
#
# กำหนด service สามตัวที่ทำงานเป็นคนละ container และสื่อสารกัน
# ผ่าน network เริ่มต้นที่ Compose สร้างขึ้นให้โปรเจกต์นี้:
#   - app     : เว็บแอปพลิเคชัน Node.js + Express (build จาก Dockerfile ของเรา)
#   - db      : ฐานข้อมูล PostgreSQL (official image)
#   - pgadmin : เว็บ UI สำหรับดู/จัดการฐานข้อมูล PostgreSQL (official image)
#
# container app และ pgadmin จะเชื่อมต่อไปยังฐานข้อมูล โดยใช้ชื่อ service "db"
# เป็น hostname (Compose มี DNS ภายในให้อัตโนมัติ) โดยไม่ใช้ "localhost"
# -----------------------------------------------------------------------

services:

  # ---------------------------------------------------------------------
  # Application service - Node.js + Express
  # ---------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyboard-app
    ports:
      # เชื่อมโยง port 8080 ของเครื่อง host เข้ากับ port 3000 ของ container
      # (ที่ Express กำลัง listen อยู่)
      - "8080:3000"
    environment:
      # environment variables เหล่านี้บอกให้แอปรู้วิธีเชื่อมต่อกับ container ฐานข้อมูล
      # DB_HOST ต้องเป็นชื่อ service ของ Compose (db) ไม่ใช่ "localhost"
      # เพราะ app และ database ทำงานอยู่คนละ container กัน
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: keyboard_cemetery
      DB_USER: keyboard_admin
      DB_PASSWORD: keyboard_pass
    depends_on:
      # กำหนดให้ container db เริ่มทำงานก่อน container app
      # (แอปเองก็มีการ retry การเชื่อมต่อฐานข้อมูลตอนเริ่มทำงานด้วย
      # เพื่อความปลอดภัย เนื่องจากสถานะ "started" ไม่ได้แปลว่า "พร้อมใช้งาน" เสมอไป)
      - db
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Database service - PostgreSQL
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: keyboard-db
    environment:
      # ค่าต้องตรงกับค่า DB_* ที่ใช้ใน service app ด้านบน
      POSTGRES_DB: keyboard_cemetery
      POSTGRES_USER: keyboard_admin
      POSTGRES_PASSWORD: keyboard_pass
    volumes:
      # เก็บข้อมูล PostgreSQL ไว้นอก writable layer ของ container
      # เพื่อให้ข้อมูลยังคงอยู่แม้จะรัน "docker compose down" (ลบ container)
      - keyboard_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # pgAdmin service - เว็บ UI สำหรับดู/จัดการฐานข้อมูล PostgreSQL
  # เป็น container ที่ 3 ของโปรเจกต์ ใช้สาธิตว่า container หลายตัว
  # สามารถเชื่อมต่อไปยัง database container เดียวกันได้พร้อมกัน
  # ---------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: keyboard-pgadmin
    environment:
      # อีเมล/รหัสผ่านสำหรับ login เข้าหน้าเว็บ pgAdmin (ไม่เกี่ยวกับ
      # user/password ของ PostgreSQL เอง)
      PGADMIN_DEFAULT_EMAIL: admin@keyboardcemetery.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
    ports:
      # เข้าใช้งานหน้าเว็บ pgAdmin ผ่าน host port 5050
      - "5050:80"
    volumes:
      # เก็บการตั้งค่า/การเชื่อมต่อที่บันทึกไว้ใน pgAdmin ให้อยู่ถาวร
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

# ---------------------------------------------------------------------
# Named volume ที่ใช้เก็บข้อมูลแบบถาวรบนเครื่อง host
# volume เหล่านี้จะไม่ถูกลบด้วย "docker compose down" (จะถูกลบก็ต่อเมื่อใช้
# "docker compose down -v" เท่านั้น) ดังนั้นข้อมูลคีย์บอร์ดและการตั้งค่า
# pgAdmin จะยังคงอยู่ แม้ container จะถูกสร้างใหม่
# ---------------------------------------------------------------------
volumes:
  keyboard_data:
  pgadmin_data:
